<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Dodaj Szachistę</title>
  </head>
  <body>
    <h1>Dodaj Szachistę</h1>
    <form
      name="szachista"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
    >
      <input type="hidden" name="form-name" value="szachista" />
      <p hidden>
        <label>Nie wypełniaj tego: <input name="bot-field" /></label>
      </p>
      <p>
        <label
          >Nazwa Szachisty: <input type="text" name="nazwa" required
        /></label>
      </p>
      <p>
        <label
          >Opis: <br /><textarea
            name="opis"
            maxlength="500"
            required
          ></textarea>
        </label>
      </p>
      <p>
        <label
          >Link do informacji: <input type="url" name="link_info" required
        /></label>
      </p>
      <p>
        <label
          >Partie (max 3 linki, po jednej na linię):<br />
          <textarea name="partie"></textarea>
        </label>
      </p>
      <p><button type="submit">Wyślij</button></p>
    </form>
  </body>
</html>
